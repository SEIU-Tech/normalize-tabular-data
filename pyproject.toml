[project]
name = "normalize-tabular-data"
version = "0.2.0"
description = "TUI for normalizing tabular data with Polars"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
    { name = "David Mertz, Ph.D.", email = "mertz@gnosis.cx" }
]
requires-python = ">=3.14"
dependencies = [
    "gnosis-date-parser>=1.0.4",
    "textual>=8.2.8",
    "polars>=1.44,<2",
    "fastexcel>=0.10",
    "xlsxwriter>=0.9",
    "platformdirs>=3.0",
    "chardet>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.10",
    "twine>=7.0.0",
    "ty>=0.0.84",
]

[project.scripts]
normalize-tabular-data = "normalize_tabular_data:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
